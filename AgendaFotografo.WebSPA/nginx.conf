# Nginx do SPA. O Traefik do Dokploy termina o HTTPS e entrega aqui na porta 80.
# - /api/...  -> proxy para a API (serviço agenda-api do compose, porta 8080), mesma origem: sem CORS.
# - / (exato) -> landing page estática (/landing/index.html), com 200 e sem redirecionar (plano 13).
#                /landing/ e /landing/index.html respondem 301 para /; o resto de /landing/ só entrega arquivo existente (404 se não houver).
# - resto     -> arquivos do Angular; rota desconhecida cai no index.html (rotas do SPA), que sai com X-Robots-Tag noindex.
# - www.quemclica.com.br -> 301 para https://quemclica.com.br (server próprio, no fim do arquivo).
#
# ATENÇÃO: add_header dentro de um location anula TODOS os add_header herdados do server. Os locations da landing não têm add_header
# próprio de propósito (herdam cache, segurança e X-Robots-Tag); o /e/ tem e por isso repete os cabeçalhos.

# Cache: bundles com hash (outputHashing=all) por 1 ano; assets/ e landing/ (sem hash) por 7 dias; index.html, rotas, robots.txt e sitemap.xml sem cache.
# Dentro de "location = /" o $uri vira /landing/index.html (try_files), por isso a landing em / sai com no-cache.
# Vazio = o header não é enviado (respostas da API mantêm o cache que a própria API definir).
map $uri $cache_control {
    ~^/api/                               "";
    ~^/assets/                            "public, max-age=604800";
    ~^/landing/index\.html$               "no-cache";
    ~^/landing/                           "public, max-age=604800";
    ~^/sw\.js$                            "no-cache";
    ~*\.(?:js|mjs|css|woff2?|ttf|otf|eot)$ "public, max-age=31536000, immutable";
    default                               "no-cache";
}

# Só o HTML do SPA (toda rota do Angular cai em /index.html) não é indexado. Vazio = o header não é enviado (landing, assets, robots, sitemap, bundles).
map $uri $x_robots {
    /index.html "noindex, nofollow";
    default     "";
}

# Repassa o protocolo original (https no Traefik); acesso direto sem proxy usa o do próprio Nginx.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    # 301 com endereço relativo: atrás do Traefik o Nginx não sabe o host/porta públicos.
    absolute_redirect off;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads do evento: imagens até 5 MB e GPX até 10 MB (+ folga do multipart).
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               image/svg+xml application/gpx+xml font/ttf font/otf;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $x_robots always;

    # IP real do visitante: atrás do Traefik o $remote_addr é o do próprio Traefik. Confia no X-Forwarded-For só vindo das faixas privadas
    # (rede do Dokploy). PROVISÓRIO: restringir à faixa real da dokploy-network (docker network inspect dokploy-network). Ver docs/deploy.md.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # DNS interno do Docker, resolvido a cada requisição: o Nginx sobe mesmo se a API ainda não estiver no ar
    # e acompanha a troca de IP do container a cada deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://agenda-api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # O IP real já foi resolvido pelo realip acima: entrega só ele (um salto; a API usa ForwardLimit = 1).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Página pública do evento (/e/<token>): rota do SPA, sem cache, sem indexação e sem Referer. O add_header dentro do location anula os do
    # server, por isso os cabeçalhos de segurança são repetidos aqui.
    location /e/ {
        # Serve o index.html aqui mesmo (rewrite ... break, sem redirecionamento interno): assim os add_header abaixo valem.
        rewrite ^ /index.html break;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Landing page (plano 13). Sem add_header próprio: herda cache, segurança e X-Robots-Tag do server.
    location = / {
        try_files /landing/index.html =404;
    }

    # O caminho físico não é indexável: 301 para o endereço canônico.
    location = /landing/ {
        return 301 /;
    }

    location = /landing/index.html {
        return 301 /;
    }

    # Fontes e imagem de compartilhamento: só arquivo existente, nunca cai no SPA.
    location ^~ /landing/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# www -> domínio sem www, mantendo caminho e query.
server {
    listen 80;
    server_name www.quemclica.com.br;
    server_tokens off;

    return 301 https://quemclica.com.br$request_uri;
}

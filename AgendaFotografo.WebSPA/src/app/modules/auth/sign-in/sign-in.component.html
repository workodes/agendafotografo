<app-qc-auth-shell layout="dividido" titulo="Entrar" subtitulo="Acesse a agenda da sua equipe."
    tituloArte="Bem-vindo de volta à sua" destaqueArte="agenda" notaArte="oi! bora ver quem clica hoje? ↘"
    widgetArte="Sáb, 14/03 · 3 provas" widgetDetalheArte="7 fotógrafos">
    <!-- Alerta de erro (ícone + texto, não só cor) -->
    <div *ngIf="showAlert" role="alert" [@shake]="alert.type === 'error'"
        class="mb-4 flex items-start gap-2 rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm font-medium text-red-800">
        <mat-icon class="icon-size-5 shrink-0" [svgIcon]="'heroicons_solid:exclamation-circle'"></mat-icon>
        <span>{{ alert.message }}</span>
    </div>

    <form [formGroup]="signInForm" #signInNgForm="ngForm" (ngSubmit)="signIn()" novalidate>
        <!-- E-mail -->
        <div>
            <label class="qc-rotulo" for="email">E-mail</label>
            <input id="email" class="qc-campo" type="email" autocomplete="username" formControlName="email"
                [attr.aria-invalid]="signInForm.get('email').invalid && (signInForm.get('email').touched || signInNgForm.submitted)">
            <div class="qc-erro" *ngIf="(signInForm.get('email').touched || signInNgForm.submitted) && signInForm.get('email').hasError('required')">
                <mat-icon class="icon-size-5 shrink-0" [svgIcon]="'heroicons_solid:exclamation-circle'"></mat-icon>
                <span>O endereço de e-mail é obrigatório.</span>
            </div>
            <div class="qc-erro" *ngIf="(signInForm.get('email').touched || signInNgForm.submitted) && signInForm.get('email').hasError('email')">
                <mat-icon class="icon-size-5 shrink-0" [svgIcon]="'heroicons_solid:exclamation-circle'"></mat-icon>
                <span>Informe um e-mail válido.</span>
            </div>
        </div>

        <!-- Senha -->
        <div class="mt-4">
            <label class="qc-rotulo" for="password">Senha</label>
            <div class="relative">
                <input id="password" class="qc-campo pr-12" type="password" autocomplete="current-password"
                    formControlName="password" #passwordField
                    [attr.aria-invalid]="signInForm.get('password').invalid && (signInForm.get('password').touched || signInNgForm.submitted)">
                <button type="button"
                    class="absolute right-1 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-lg text-[#7c2d12]"
                    [attr.aria-label]="passwordField.type === 'password' ? 'Mostrar senha' : 'Ocultar senha'"
                    (click)="passwordField.type === 'password' ? passwordField.type = 'text' : passwordField.type = 'password'">
                    <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'password'"
                        [svgIcon]="'heroicons_solid:eye'"></mat-icon>
                    <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'text'"
                        [svgIcon]="'heroicons_solid:eye-slash'"></mat-icon>
                </button>
            </div>
            <div class="qc-erro" *ngIf="(signInForm.get('password').touched || signInNgForm.submitted) && signInForm.get('password').hasError('required')">
                <mat-icon class="icon-size-5 shrink-0" [svgIcon]="'heroicons_solid:exclamation-circle'"></mat-icon>
                <span>A senha deve ser preenchida.</span>
            </div>
        </div>

        <!-- Lembrar-me -->
        <label class="mt-4 flex min-h-[44px] cursor-pointer items-center gap-3 text-sm">
            <input type="checkbox" formControlName="rememberMe" class="h-5 w-5 accent-[#c2410c]">
            <span>Lembrar-me</span>
        </label>

        <button type="submit" class="qc-btn qc-btn-primario qc-btn-bloco mt-4" [disabled]="signInForm.disabled">
            <span *ngIf="!signInForm.disabled">Entrar</span>
            <mat-progress-spinner *ngIf="signInForm.disabled" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
        </button>

        <!-- "Esqueci minha senha": pendente (plano 15). Não há contato de suporte na landing; o colaborador define e-mail ou WhatsApp. -->
    </form>
</app-qc-auth-shell>

<div class="flex flex-col sm:flex-row items-center md:items-start sm:justify-center md:justify-start flex-auto min-w-0">
    <div
        class="md:flex items-center justify-center w-full sm:w-auto md:h-full md:w-[30%] py-8 px-4 sm:p-12 md:p-16 sm:rounded-2xl md:rounded-none sm:shadow md:shadow-none sm:bg-card">
        <div class="w-full max-w-100 mx-auto sm:mx-0">
            <!-- Logo -->

            <div class="w-full flex justify-center items-center mx-auto">
                <img src="assets/images/logo/logo.png" class="w-48 sm:w-52" alt="quemclica">
            </div>

            <!-- Alert -->
            <fuse-alert *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type"
                [@shake]="alert.type === 'error'">
                {{alert.message}}
            </fuse-alert>

            <!-- Sign in form -->
            <form class="mt-4 w-full" [formGroup]="signInForm" #signInNgForm="ngForm">

                <!-- Email field -->
                <mat-form-field class="w-full">
                    <mat-label>Email</mat-label>
                    <input id="email" matInput type="email" autocomplete="username" [formControlName]="'email'">
                    <mat-error *ngIf="signInForm.get('email').hasError('required')">
                        O Endereço de Email é Obrigatório
                    </mat-error>
                    <mat-error *ngIf="signInForm.get('email').hasError('email')">
                        Por Favor Insira um Email Valido
                    </mat-error>
                </mat-form-field>

                <!-- Password field -->
                <mat-form-field class="w-full">
                    <mat-label>Senha</mat-label>
                    <input id="password" matInput type="password" autocomplete="current-password" [formControlName]="'password'" #passwordField>
                    <button mat-icon-button type="button"
                        (click)="passwordField.type === 'password' ? passwordField.type = 'text' : passwordField.type = 'password'"
                        matSuffix>
                        <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'password'"
                            [svgIcon]="'heroicons_solid:eye'"></mat-icon>
                        <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'text'"
                            [svgIcon]="'heroicons_solid:eye-slash'"></mat-icon>
                    </button>
                    <mat-error>
                        A Senha Deve Ser Preenchida
                    </mat-error>
                </mat-form-field>

                <!-- Actions -->
                <div class="inline-flex items-center justify-between w-full mt-1.5">
                    <mat-checkbox class="-ml-2" [color]="'primary'" [formControlName]="'rememberMe'">
                        Lembrar me
                    </mat-checkbox>
                    <!-- Recuperação de senha: a API ainda não tem o endpoint. Para redefinir, fale com o suporte. -->
                </div>

                <!-- Submit button -->
                <button class="fuse-mat-button-large w-full mt-6" mat-flat-button [color]="'primary'"
                    [disabled]="signInForm.disabled" (click)="signIn()">
                    <span *ngIf="!signInForm.disabled">
                        Entrar
                    </span>
                    <mat-progress-spinner *ngIf="signInForm.disabled" [diameter]="24"
                        [mode]="'indeterminate'"></mat-progress-spinner>
                </button>

                <!-- Help links -->
                <!-- <div class="mt-4 flex justify-end w-full">
                    <button mat-button color="primary" [routerLink]="['/ajuda']">
                        <mat-icon class="mr-1" fontIcon="help_outline"></mat-icon>
                        Ajuda
                    </button>
                </div> -->

            </form>
        </div>
    </div>
    <div
        class="relative hidden md:flex flex-auto items-center justify-center w-1/2 h-full p-16 lg:px-28 overflow-hidden bg-gray-800 dark:border-l">
        <img src="assets/images/background/background.jpeg" alt="Bem-vindo"
            class="absolute inset-0 w-full h-full object-cover pointer-events-none" />
    </div>
</div>

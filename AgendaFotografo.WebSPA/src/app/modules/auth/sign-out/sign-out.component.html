<app-qc-auth-shell titulo="Você saiu!" [mostrarMascote]="false">
    <div class="text-center">
        <app-mascote tamanho="medio" />
        <p class="mt-4 font-medium" aria-live="polite">
            <ng-container *ngIf="countdown > 0">
                Redirecionando em {{ countdown | i18nPlural: countdownMapping }}
            </ng-container>
            <ng-container *ngIf="countdown === 0">
                Você será redirecionado!
            </ng-container>
        </p>
        <a class="qc-btn qc-btn-primario mt-6" [routerLink]="['/sign-in']">Ir para o login</a>
    </div>
</app-qc-auth-shell>

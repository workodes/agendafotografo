<h2 mat-dialog-title class="!pb-0">{{ edicao ? 'Editar pendência' : 'Nova pendência' }}</h2>
<div class="px-6 pb-1 text-sm text-secondary break-words">{{ subtitulo }}</div>

<mat-dialog-content class="!pt-3">
    <app-pendencia-form #f [data]="data" (concluido)="fechar($event)" (cancelado)="cancelar()"></app-pendencia-form>
</mat-dialog-content>

<mat-dialog-actions class="!flex-wrap !justify-between gap-2">
    <button *ngIf="edicao" mat-stroked-button color="warn" type="button" [disabled]="f.salvando || f.excluindo" (click)="f.excluir()">
        <mat-progress-spinner *ngIf="f.excluindo" diameter="20" mode="indeterminate"></mat-progress-spinner>
        <ng-container *ngIf="!f.excluindo">
            <mat-icon svgIcon="heroicons_outline:trash"></mat-icon>
            <span class="ml-2">Excluir</span>
        </ng-container>
    </button>
    <span class="flex-1"></span>
    <button mat-button type="button" [disabled]="f.salvando || f.excluindo" (click)="f.cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="button" [disabled]="f.salvando || f.excluindo" (click)="f.salvar()">
        <mat-progress-spinner *ngIf="f.salvando" diameter="20" mode="indeterminate"></mat-progress-spinner>
        <span *ngIf="!f.salvando">Salvar</span>
    </button>
</mat-dialog-actions>

<section class="flex-1 flex flex-col min-w-0 p-4 rounded-2xl shadow bg-card" aria-label="Despesas por categoria">
    <h2 class="m-0 mb-3 text-lg font-semibold text-accent-900">Despesas por categoria</h2>

    <div *ngIf="vazio" class="flex flex-1 items-center justify-center px-4 py-8 text-center text-secondary">Nenhuma despesa neste período.</div>

    <!-- Barras em HTML (não no ApexCharts): nome e valor ficam na mesma linha, acima da barra, então nada é cortado nem cobre a barra.
         O texto da lista já é lido pelo leitor de tela; as barras são só desenho (aria-hidden). -->
    <ul *ngIf="!vazio" class="flex flex-col gap-3 list-none m-0 p-0 min-w-0" [attr.aria-label]="descricao">
        <li *ngFor="let b of barras" class="flex flex-col gap-1 min-w-0">
            <div class="flex items-baseline justify-between gap-3 min-w-0 text-sm">
                <span class="min-w-0 break-words text-default">{{ b.nome }}</span>
                <span class="shrink-0 font-semibold tabular-nums text-red-700">{{ formatar(b.total) }}</span>
            </div>
            <div class="h-2 w-full rounded-full bg-gray-100 overflow-hidden" aria-hidden="true">
                <div class="h-full rounded-full" [style.width.%]="b.percentual" [style.background-color]="corBarra"></div>
            </div>
        </li>
    </ul>
</section>

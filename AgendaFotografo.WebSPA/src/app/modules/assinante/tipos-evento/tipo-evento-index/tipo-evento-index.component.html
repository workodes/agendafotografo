<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden" appFecharComEsc (esc)="aoEsc()">
    <mat-drawer-container class="flex-auto h-full bg-white" (backdropClick)="fecharFicha()">

        <mat-drawer class="w-full md:w-[480px] max-w-full" mode="over" position="end" autoFocus="dialog" [disableClose]="true" #detailsDrawer
            (closedStart)="onFichaFechada()">
            <router-outlet></router-outlet>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col bg-white">
            <div class="flex flex-col flex-auto min-h-0">
                <!-- Abaixo de sm o cabeçalho empilha (título, busca, botões) -->
                <app-pagina-cabecalho titulo="Tipos de evento" [contador]="totalCount">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2 w-full sm:w-auto">
                        <mat-form-field class="fuse-mat-dense fuse-mat-rounded sm:min-w-64 w-full sm:w-auto" subscriptSizing="dynamic">
                            <mat-icon class="icon-size-5" svgIcon="heroicons_outline:magnifying-glass" matPrefix></mat-icon>
                            <input matInput [formControl]="busca" autocomplete="off" placeholder="Nome do tipo">
                        </mat-form-field>

                        <div class="flex items-center justify-between sm:justify-start gap-2">
                            <a mat-flat-button color="primary" [routerLink]="['novo']">
                                <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
                                <span class="ml-2">Novo</span>
                            </a>
                            <app-filtro-botao [ativo]="filtrosAtivos" (clicado)="abrirFiltros()"></app-filtro-botao>
                        </div>
                    </div>
                </app-pagina-cabecalho>

                <div class="flex flex-col flex-auto min-h-0 py-4 px-4 sm:px-6 md:px-8">
                    <div *ngIf="loading && dataSource.data.length === 0" class="flex items-center justify-center py-12">
                        <mat-progress-spinner diameter="32" mode="indeterminate"></mat-progress-spinner>
                    </div>

                    <div *ngIf="!(loading && dataSource.data.length === 0)" [class.opacity-60]="loading" [attr.aria-busy]="loading"
                        class="transition-opacity flex flex-col flex-1 min-h-0">
                        <div class="flex-1 min-h-0 overflow-auto">
                            <!-- Abaixo de sm: layout fixo e células com pouco padding, para caber em 360 px sem rolar na horizontal -->
                            <table mat-table [dataSource]="dataSource" class="w-full max-sm:table-fixed">
                                <ng-container matColumnDef="TPE_NOME">
                                    <th mat-header-cell *matHeaderCellDef class="text-left max-sm:!px-2">Nome</th>
                                    <td mat-cell *matCellDef="let t" class="max-sm:!px-2">
                                        <div class="truncate font-medium" [attr.title]="t.TPE_NOME">{{ t.TPE_NOME }}</div>
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="TPE_ATIVO">
                                    <th mat-header-cell *matHeaderCellDef class="max-sm:w-[84px] sm:w-[110px] text-left max-sm:!px-2">Status</th>
                                    <td mat-cell *matCellDef="let t" class="whitespace-nowrap max-sm:!px-2">
                                        <span class="leading-none rounded-full px-2 sm:px-3 py-1.5 text-xs font-semibold inline-flex items-center"
                                            [ngClass]="t.TPE_ATIVO ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-700'">
                                            {{ t.TPE_ATIVO ? 'Ativo' : 'Inativo' }}
                                        </span>
                                    </td>
                                </ng-container>

                                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                                    class="cursor-pointer hover:bg-hover" (click)="abrir(row, $event)" (auxclick)="abrir(row, $event)"></tr>
                            </table>

                            <div *ngIf="dataSource.data.length === 0 && !loading" class="flex flex-col items-center gap-2 py-12 text-center text-secondary">
                                <mat-icon class="icon-size-14 text-hint" svgIcon="heroicons_outline:tag"></mat-icon>
                                <div class="text-lg font-medium">Nenhum tipo de evento encontrado.</div>
                            </div>
                        </div>

                        <mat-paginator [length]="totalCount" [pageIndex]="page" [pageSize]="pageSize"
                            [pageSizeOptions]="[10, 25, 50, 100]" (page)="onPage($event)" showFirstLastButtons>
                        </mat-paginator>
                    </div>
                </div>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>

    <app-filtro-painel [aberto]="filtroAberto" (aplicar)="aplicarFiltros()" (limpar)="limparFiltros()" (fechar)="fecharFiltros()">
        <mat-form-field appearance="fill" floatLabel="always" class="fuse-mat-rounded fuse-mat-dense">
            <mat-label>Situação</mat-label>
            <mat-select [formControl]="situacao">
                <mat-option value="true">Ativos</mat-option>
                <mat-option value="false">Inativos</mat-option>
                <mat-option value="todos">Todos</mat-option>
            </mat-select>
        </mat-form-field>
    </app-filtro-painel>
</div>

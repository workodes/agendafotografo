<div class="w-12 h-12 flex items-center justify-center bg-card rounded-full overflow-hidden">
    <button mat-icon-button class="flex items-center justify-center" [matMenuTriggerFor]="userActions" aria-label="Menu do usuário">
        <img *ngIf="this.logo" class="rounded-full" [src]="this.logo" alt="Logo"
            style="object-fit: scale-down; width: 100%; height: 100%; border-radius: 50%;">
        <mat-icon *ngIf="!this.logo" class="rounded-full" [svgIcon]="'heroicons_outline:user-circle'"
            style="object-fit: scale-down; width: 100%; height: 100%; border-radius: 50%;"></mat-icon>
    </button>
</div>

<mat-menu class="menu-usuario" [xPosition]="'before'" #userActions="matMenu">
    <div class="menu-usuario-cabecalho" (click)="$event.stopPropagation()">
        <div class="menu-usuario-avatar">
            <img *ngIf="this.logo" [src]="this.logo" alt="Logo">
            <mat-icon *ngIf="!this.logo" [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
        </div>
        <div class="flex flex-col min-w-0">
            <span class="text-xs text-secondary">Logado com</span>
            <span class="font-semibold truncate">{{usuario?.Email}}</span>
            <span *ngIf="usuario?.AssinanteNome" class="text-xs text-secondary truncate">{{usuario?.AssinanteNome}}</span>
        </div>
    </div>

    <button mat-menu-item (click)="alterarSenha()">
        <mat-icon [svgIcon]="'heroicons_outline:key'"></mat-icon>
        <span>Alterar senha</span>
    </button>
    <button mat-menu-item class="menu-usuario-sair" (click)="signOut()">
        <mat-icon [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
        <span>Sair</span>
    </button>
</mat-menu>

<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<ng-container *ngIf="isScreenSmall">
    <fuse-vertical-navigation class="dark gaveta-marrom print:hidden" [mode]="'over'" [name]="'mainNavigation'"
        [navigation]="navigation.horizontal" [opened]="false">
        <!-- Navigation header hook -->
        <ng-container fuseVerticalNavigationContentHeader>
            <!-- Logo -->
            <div class="flex items-center h-20 pt-6 px-8 mb-4">
                <div class="w-full flex justify-center">
                    <img src="assets/images/logo/logo-branco.png" class="w-36" alt="quemclica">
                </div>
            </div>
        </ng-container>
    </fuse-vertical-navigation>
</ng-container>

<!-- Wrapper -->
<div class="flex flex-col flex-auto w-full min-w-0" appFecharComEsc (esc)="fecharGaveta()">

    <!-- Cabeçalho (padrão Fartec.Portal) -->
    <div class="menu-topo sticky top-0 flex flex-0 items-center w-full h-16 px-4 md:px-6 z-49 bg-card print:hidden">
        <!-- Marca -->
        <a class="flex items-center shrink-0 mr-4 lg:mr-8 cursor-pointer" [routerLink]="rotaInicio" title="Início">
            <img src="assets/images/logo/logo.png" class="h-9 sm:h-10 w-auto" alt="quemclica">
        </a>

        <!-- Menu horizontal (desktop) -->
        <fuse-horizontal-navigation *ngIf="!isScreenSmall" class="menu-horizontal mr-2" [name]="'mainNavigation'"
            [navigation]="navigation.horizontal"></fuse-horizontal-navigation>

        <!-- Botão de menu (tela pequena) -->
        <button *ngIf="isScreenSmall" mat-icon-button (click)="toggleNavigation('mainNavigation')" aria-label="Abrir menu">
            <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
        </button>

        <!-- Components -->
        <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
            <ng-container *ngIf="ehAssinante">
                <busca-global [modo]="isScreenLarge ? 'campo' : 'barra'"></busca-global>
                <teste-gratis></teste-gratis>
                <avisos></avisos>
            </ng-container>
            <user></user>
        </div>
    </div>


    <!-- Content -->
    <div class="flex flex-col flex-auto w-full" [ngClass]="{ 'lg:pr-16': assistenteVisivel }">
        <router-outlet *ngIf="true"></router-outlet>
    </div>
    <!-- Rodapé: some abaixo de md -->
    <div class="relative hidden md:flex flex-0 items-center w-full h-14 px-4 md:px-6 z-49 border-t bg-card print:hidden" [ngClass]="{ 'lg:pr-[5.5rem]': assistenteVisivel }">
        <span class="font-medium text-secondary">
            quemclica &copy; {{currentYear}}, Todos os Direitos Reservados
        </span>
    </div>
</div>

<!-- Assistente com IA (plano 11): só Assinante com o chat ligado na API; sem rota, menu nem atalho no cabeçalho -->
<assistente *ngIf="assistenteVisivel"></assistente>

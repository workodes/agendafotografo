<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<ng-container *ngIf="isScreenSmall">
    <fuse-vertical-navigation class="dark bg-gray-900 print:hidden" [mode]="'over'" [name]="'mainNavigation'"
        [navigation]="navigation.horizontal" [opened]="false">
        <!-- Navigation header hook -->
        <ng-container fuseVerticalNavigationContentHeader>
            <!-- Logo -->
            <div class="flex items-center h-20 pt-6 px-8 mb-4">
                <div class="w-full flex justify-center">
                    <img src="assets/images/logo/logo-branco.png" class="w-44" alt="AgendaFotografo">
                </div>
            </div>
        </ng-container>
    </fuse-vertical-navigation>
</ng-container>

<!-- Wrapper -->
<div class="flex flex-col flex-auto w-full min-w-0">

    <!-- Header -->
    <div
        class="relative flex flex-0 items-center w-full h-16 sm:h-20 px-3 sm:px-4 md:px-6 z-49 shadow dark:shadow-none dark:border-b bg-card dark:bg-transparent print:hidden">
        <ng-container *ngIf="!isScreenSmall">
            <!-- Logo -->
            <a class="flex items-center mx-2 lg:mr-8 cursor-pointer" [routerLink]="rotaInicio" title="Início">
                <img src="assets/images/logo/logo.png" class="h-12 w-auto" alt="AgendaFotografo">
            </a>
            <!-- Horizontal navigation -->
            <fuse-horizontal-navigation class="mr-2" [name]="'mainNavigation'"
                [navigation]="navigation.horizontal"></fuse-horizontal-navigation>
        </ng-container>
        <!-- Navigation toggle button -->
        <ng-container *ngIf="isScreenSmall">
            <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
                <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
            </button>
            <img src="assets/images/logo/logo.png" class="h-8 sm:h-9 w-auto ml-1 sm:ml-2" alt="AgendaFotografo">
        </ng-container>
        <!-- Components -->
        <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
            <ng-container *ngIf="ehAssinante">
                <busca-global [modo]="isScreenLarge ? 'campo' : 'barra'"></busca-global>
                <avisos></avisos>
            </ng-container>
            <user></user>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col flex-auto w-full">
        <router-outlet *ngIf="true"></router-outlet>
    </div>
    <!-- Rodapé: some abaixo de md -->
    <div class="relative hidden md:flex flex-0 items-center w-full h-15 px-4 md:px-6 z-49 border-t bg-card print:hidden">
        <span class="font-medium text-secondary w-full text-center">
            AgendaFotografo &copy; {{currentYear}}, Todos os Direitos Reservados
        </span>
    </div>
</div>

<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>AgendaFotografo</title>
    <meta name="description" content="Agenda de equipe para fotógrafos de eventos esportivos">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
    <base href="/">
    <meta name="theme-color" content="#F97316">

    <!-- App instalável (PWA) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/images/pwa/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FOKOPP">


    <!-- Favicon -->
    <link rel="icon" type="image/ico" href="./assets/images/favicon/favicon.ico">

    <!-- Fonts -->
    <link href="assets/fonts/inter/inter.css" rel="stylesheet">

    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">

    <!-- Icon fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Splash screen styles -->
    <link href="assets/styles/splash-screen.css" rel="stylesheet">

</head>

<body>

    <!-- Splash screen -->
    <fuse-splash-screen>
        <img src="assets/images/logo/logo.png" alt="AgendaFotografo" width="200px">
        <div class="spinner">
            <div class="bounce1"></div>
            <div class="bounce2"></div>
            <div class="bounce3"></div>
        </div>
    </fuse-splash-screen>

    <!-- App root -->
    <app-root></app-root>

    <script>
        // Guarda o convite de instalação (Chrome/Edge/Android) para o botão "Instalar agora" usar depois do login
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__pwaPrompt = e; });
        // Registra o service worker (necessário para instalar como app). Só em https ou localhost.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
        }
    </script>
</body>

</html>
